<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ollama Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 5rem; font: inherit; }
    button { padding: 0.5rem 1rem; margin-top: 0.5rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-wrap: break-word; }
    #status { font-weight: bold; }
    #status.ok { color: green; }
    #status.error { color: red; }
  </style>
</head>
<body>
  <h1>Ollama Test</h1>

  <p>Server: <span id="status">checking...</span></p>

  <label for="model">Model</label><br />
  <input id="model" value="gemma3:12b" /><br /><br />

  <label for="prompt">Prompt</label><br />
  <textarea id="prompt">Write a short poem about the ocean.</textarea><br />
  <button id="send">Send</button>

  <pre id="output"></pre>

  <script>
    const OLLAMA_URL = 'http://localhost:11434';

    async function checkStatus() {
      const el = document.getElementById('status');
      try {
        const res = await fetch(OLLAMA_URL + '/');
        const text = await res.text();
        el.textContent = text.trim();
        el.className = 'ok';
      } catch (err) {
        el.textContent = 'unreachable (' + err.message + ')';
        el.className = 'error';
      }
    }

    document.getElementById('send').addEventListener('click', async () => {
      const model = document.getElementById('model').value;
      const prompt = document.getElementById('prompt').value;
      const output = document.getElementById('output');
      output.textContent = 'loading...';

      try {
        const res = await fetch(OLLAMA_URL + '/api/generate', {
          method: 'POST',
          body: JSON.stringify({ model, prompt, stream: false }),
        });
        const data = await res.json();
        output.textContent = data.response ?? JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'error: ' + err.message;
      }
    });

    checkStatus();
  </script>
</body>
</html>
